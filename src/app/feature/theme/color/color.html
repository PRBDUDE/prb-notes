<div class="page-content-container">
  <prb-theme-sub-menu />

  <div class="page-content">
    <h2>Header</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-header-background'" />
      <prb-palette [colorVariableName]="'--color-header-text'" />
    </div>

    <h2>Footer</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-footer-background'" />
      <prb-palette [colorVariableName]="'--color-footer-text'" />
    </div>

    <h2>General</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-content-background'" />
      <prb-palette [colorVariableName]="'--color-content-text'" />

      <prb-palette [colorVariableName]="'--color-menu-background'" />
      <prb-palette [colorVariableName]="'--color-menu-text'" />
      <prb-palette [colorVariableName]="'--color-menu-background-hover'" />

      <prb-palette [colorVariableName]="'--color-question-background'" />
      <prb-palette [colorVariableName]="'--color-question-text'" />

      <prb-palette [colorVariableName]="'--color-code-text-background'" />
      <prb-palette [colorVariableName]="'--color-code-text-text'" />

      <prb-palette [colorVariableName]="'--color-block-quote-border'" />
    </div>

    <h2>Card</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-card-container-background'" />
      <prb-palette [colorVariableName]="'--color-card-border'" />
      <prb-palette [colorVariableName]="'--color-card-margin'" />
      <prb-palette [colorVariableName]="'--color-card-background'" />
      <prb-palette [colorVariableName]="'--color-card-text'" />
    </div>

    <h2>Code Highlighting</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-class-name'" />
      <prb-palette [colorVariableName]="'--color-html-tag'" />
      <prb-palette [colorVariableName]="'--color-string'" />
      <prb-palette [colorVariableName]="'--color-note'" />
      <prb-palette [colorVariableName]="'--color-comment'" />
      <prb-palette [colorVariableName]="'--color-key-word'" />
      <prb-palette [colorVariableName]="'--color-method-name'" />
      <prb-palette [colorVariableName]="'--color-property'" />
    </div>

    <h2>Headers</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-h1'" />
      <prb-palette [colorVariableName]="'--color-h2'" />
      <prb-palette [colorVariableName]="'--color-h3'" />
    </div>

    <h2>Button</h2>
    <div class="group">
      <prb-palette [colorVariableName]="'--color-primary-button-background'" />
      <prb-palette [colorVariableName]="'--color-primary-button-hover'" />
      <prb-palette [colorVariableName]="'--color-primary-button-text'" />

      <prb-palette [colorVariableName]="'--color-secondary-button-background'" />
      <prb-palette [colorVariableName]="'--color-secondary-button-hover'" />
      <prb-palette [colorVariableName]="'--color-secondary-button-text'" />
    </div>
  </div>
</div>
